<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fruit Lens - Offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#12261c;color:#f5efe0;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-size:22px;margin:0 0 8px} p{opacity:.8;margin:0 0 20px} button{background:#e67e22;color:#fff;border:0;border-radius:999px;padding:12px 24px;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div>
  <h1 id="t">Tidak ada koneksi internet</h1>
  <p id="d">Periksa koneksi Anda, lalu coba lagi.</p>
  <button id="b" onclick="location.reload()">Coba lagi</button>
</div>
<script>
  try {
    if (localStorage.getItem("fl_lang") === "en") {
      t.textContent = "No internet connection"; d.textContent = "Check your connection and try again."; b.textContent = "Try again";
      document.documentElement.lang = "en";
    }
  } catch (e) {}
</script>
</body>
</html>
